<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>查找音量最低音频</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f2;
      --text: #18201c;
      --muted: #5c6862;
      --panel: #ffffff;
      --panel-2: #eef4f0;
      --line: #d8ded8;
      --accent: #0f7b6c;
      --accent-strong: #075c51;
      --accent-soft: #dcefeb;
      --danger: #a33a32;
      --shadow: 0 18px 45px rgba(24, 32, 28, 0.1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121716;
        --text: #edf2ef;
        --muted: #aab7b1;
        --panel: #1c2421;
        --panel-2: #24302c;
        --line: #35423d;
        --accent: #69d2c3;
        --accent-strong: #a9f0e5;
        --accent-soft: #173a36;
        --danger: #ff9c93;
        --shadow: 0 18px 45px rgba(0, 0, 0, 0.28);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0;
    }

    .app-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 20px;
      align-items: end;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(26px, 4vw, 44px);
      line-height: 1.12;
      letter-spacing: 0;
      font-weight: 700;
    }

    .intro {
      margin: 0;
      max-width: 720px;
      color: var(--muted);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .metric,
    .drop-zone,
    .player-panel,
    .search-panel,
    .results-wrap,
    .empty-state {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .metric {
      padding: 16px;
      min-width: 0;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 6px;
    }

    .metric strong {
      display: block;
      overflow-wrap: anywhere;
      font-size: 22px;
      line-height: 1.2;
      font-weight: 700;
    }

    .drop-zone {
      position: relative;
      padding: 26px;
      margin-bottom: 18px;
      outline: 2px dashed transparent;
      outline-offset: -10px;
      transition: background 160ms ease, outline-color 160ms ease;
    }

    .drop-zone.is-dragging {
      background: var(--accent-soft);
      outline-color: var(--accent);
    }

    .drop-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: center;
    }

    .drop-title {
      margin: 0 0 6px;
      font-size: 20px;
      font-weight: 700;
    }

    .drop-copy {
      margin: 0;
      color: var(--muted);
    }

    .file-input {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
    }

    button,
    .upload-button {
      appearance: none;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 10px 14px;
      font: inherit;
      font-weight: 650;
      text-decoration: none;
      white-space: nowrap;
    }

    button:hover,
    .upload-button:hover {
      border-color: var(--accent);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .primary-action {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      .primary-action {
        color: #09211f;
      }
    }

    .status-line {
      min-height: 26px;
      margin: 0 0 12px;
      color: var(--muted);
    }

    .status-line.error {
      color: var(--danger);
    }

    .progress {
      display: none;
      height: 9px;
      margin-bottom: 18px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--panel-2);
      border: 1px solid var(--line);
    }

    .progress.is-visible {
      display: block;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: var(--accent);
      transition: width 140ms ease;
    }

    .player-panel {
      display: grid;
      gap: 10px;
      margin-bottom: 18px;
      padding: 16px;
    }

    .player-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .mode-button[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      .mode-button[aria-pressed="true"] {
        color: #09211f;
      }
    }

    .player-title {
      margin: 0;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    audio {
      width: 100%;
    }

    .search-panel {
      display: grid;
      gap: 10px;
      margin-bottom: 18px;
      padding: 16px;
    }

    .search-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: end;
    }

    .search-field {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .search-field label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    input[type="search"] {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--text);
      padding: 10px 12px;
      font: inherit;
    }

    .search-count {
      margin: 0;
      color: var(--muted);
    }

    .results-wrap {
      overflow: hidden;
    }

    .table-scroll {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 860px;
    }

    th,
    td {
      padding: 13px 14px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
    }

    th {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      background: var(--panel-2);
    }

    tr:last-child td {
      border-bottom: 0;
    }

    tr.lowest-row td {
      background: var(--accent-soft);
    }

    tr.playable-row {
      cursor: pointer;
    }

    tr.playable-row:hover td,
    tr.playing-row td {
      background: var(--accent-soft);
    }

    .play-button {
      min-height: 34px;
      padding: 6px 10px;
    }

    .name-cell {
      max-width: 360px;
      overflow-wrap: anywhere;
      font-weight: 650;
    }

    .mono {
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--accent);
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    @media (prefers-color-scheme: dark) {
      .badge {
        color: #09211f;
      }
    }

    .bar-track {
      width: 100%;
      min-width: 120px;
      height: 10px;
      border-radius: 999px;
      background: var(--panel-2);
      overflow: hidden;
      border: 1px solid var(--line);
    }

    .bar-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
    }

    .empty-state {
      padding: 30px;
      color: var(--muted);
      text-align: center;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 780px) {
      main {
        width: min(100% - 22px, 1120px);
        padding: 22px 0;
      }

      .app-header,
      .drop-layout,
      .search-layout {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .summary {
        grid-template-columns: 1fr;
      }

      .actions {
        justify-content: stretch;
      }

      button,
      .upload-button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="app-header">
      <div>
        <h1>查找音量最低音频</h1>
        <p class="intro">批量上传音频，页面会计算每条音频的峰值分贝 dBFS，并找出最高音量分贝最小的那一条。</p>
      </div>
    </header>

    <section class="summary" aria-label="分析摘要">
      <div class="metric">
        <span>已分析</span>
        <strong id="countMetric">0 条</strong>
      </div>
      <div class="metric">
        <span>音量最低</span>
        <strong id="lowestMetric">等待上传</strong>
      </div>
      <div class="metric">
        <span>最低峰值</span>
        <strong id="peakMetric">-- dBFS</strong>
      </div>
    </section>

    <section class="drop-zone" id="dropZone" aria-label="上传音频">
      <input class="file-input" id="fileInput" type="file" accept="audio/*" multiple>
      <div class="drop-layout">
        <div>
          <p class="drop-title">选择或拖入一组音频文件</p>
          <p class="drop-copy">支持浏览器可解码的常见格式，例如 wav、mp3、m4a、aac、ogg、flac。全部计算在本机浏览器内完成。</p>
        </div>
        <div class="actions">
          <label class="upload-button primary-action" for="fileInput">选择音频</label>
          <button type="button" id="clearButton" disabled>清空结果</button>
        </div>
      </div>
    </section>

    <p class="status-line" id="statusLine" aria-live="polite">等待音频文件。</p>
    <div class="progress" id="progressWrap" aria-hidden="true">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <section class="player-panel hidden" id="playerPanel" aria-label="音频播放器">
      <p class="player-title" id="playerTitle">未选择音频</p>
      <div class="player-controls" aria-label="播放模式">
        <button class="mode-button" id="repeatOneButton" type="button" aria-pressed="false">单条重复</button>
        <button class="mode-button" id="autoNextButton" type="button" aria-pressed="false">自动往下播放</button>
      </div>
      <audio id="audioPlayer" controls></audio>
    </section>

    <section class="search-panel hidden" id="searchPanel" aria-label="音频搜索">
      <div class="search-layout">
        <div class="search-field">
          <label for="searchInput">搜索音频</label>
          <input id="searchInput" type="search" placeholder="输入文件名关键词">
        </div>
        <button type="button" id="clearSearchButton" disabled>清除搜索</button>
      </div>
      <p class="search-count" id="searchCount">显示 0 / 0 条</p>
    </section>

    <section class="results-wrap hidden" id="resultsWrap" aria-label="音频峰值分析结果">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th scope="col">结果</th>
              <th scope="col">播放</th>
              <th scope="col">文件名</th>
              <th scope="col">峰值分贝</th>
              <th scope="col">峰值振幅</th>
              <th scope="col">时长</th>
              <th scope="col">相对峰值</th>
            </tr>
          </thead>
          <tbody id="resultsBody"></tbody>
        </table>
      </div>
    </section>

    <section class="empty-state" id="emptyState">上传后会在这里显示排序结果，排在第一位的就是目标音频。</section>
  </main>

  <script>
    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const clearButton = document.getElementById('clearButton');
    const statusLine = document.getElementById('statusLine');
    const progressWrap = document.getElementById('progressWrap');
    const progressBar = document.getElementById('progressBar');
    const playerPanel = document.getElementById('playerPanel');
    const playerTitle = document.getElementById('playerTitle');
    const repeatOneButton = document.getElementById('repeatOneButton');
    const autoNextButton = document.getElementById('autoNextButton');
    const audioPlayer = document.getElementById('audioPlayer');
    const searchPanel = document.getElementById('searchPanel');
    const searchInput = document.getElementById('searchInput');
    const clearSearchButton = document.getElementById('clearSearchButton');
    const searchCount = document.getElementById('searchCount');
    const resultsWrap = document.getElementById('resultsWrap');
    const resultsBody = document.getElementById('resultsBody');
    const emptyState = document.getElementById('emptyState');
    const countMetric = document.getElementById('countMetric');
    const lowestMetric = document.getElementById('lowestMetric');
    const peakMetric = document.getElementById('peakMetric');

    let audioContext = null;
    let currentRun = 0;
    let results = [];
    let activeAudioUrl = null;
    let activeItemId = null;
    let repeatOne = false;
    let autoNext = false;
    let playbackDelayTimer = null;
    let searchTerm = '';
    const playbackGapMs = 500;

    fileInput.addEventListener('change', () => {
      analyzeFiles(Array.from(fileInput.files || []));
      fileInput.value = '';
    });

    clearButton.addEventListener('click', () => {
      currentRun += 1;
      clearPlayback();
      revokeResultUrls();
      results = [];
      resetSearch();
      renderResults();
      setStatus('等待音频文件。');
    });

    searchInput.addEventListener('input', () => {
      searchTerm = searchInput.value.trim().toLocaleLowerCase('zh-CN');
      clearSearchButton.disabled = searchTerm.length === 0;
      renderResults();
    });

    clearSearchButton.addEventListener('click', () => {
      resetSearch();
      renderResults();
      searchInput.focus();
    });

    repeatOneButton.addEventListener('click', () => {
      repeatOne = !repeatOne;
      updatePlaybackModeButtons();
    });

    autoNextButton.addEventListener('click', () => {
      autoNext = !autoNext;
      updatePlaybackModeButtons();
    });

    audioPlayer.addEventListener('ended', () => {
      if (repeatOne) {
        schedulePlayback(() => {
          audioPlayer.currentTime = 0;
          const currentItem = results.find((item) => item.id === activeItemId);
          playItem(currentItem);
        });
        return;
      }
      if (autoNext) {
        schedulePlayback(playNextItem);
        return;
      }
      renderResults();
    });

    audioPlayer.addEventListener('pause', () => {
      renderResults();
    });

    audioPlayer.addEventListener('play', () => {
      renderResults();
    });

    ['dragenter', 'dragover'].forEach((eventName) => {
      dropZone.addEventListener(eventName, (event) => {
        event.preventDefault();
        dropZone.classList.add('is-dragging');
      });
    });

    ['dragleave', 'drop'].forEach((eventName) => {
      dropZone.addEventListener(eventName, (event) => {
        event.preventDefault();
        dropZone.classList.remove('is-dragging');
      });
    });

    dropZone.addEventListener('drop', (event) => {
      const files = Array.from(event.dataTransfer.files || []).filter((file) => file.type.startsWith('audio/') || looksLikeAudio(file.name));
      analyzeFiles(files);
    });

    async function analyzeFiles(files) {
      if (!files.length) {
        setStatus('没有找到可分析的音频文件。', true);
        return;
      }

      const runId = currentRun + 1;
      currentRun = runId;
      clearPlayback();
      revokeResultUrls();
      results = [];
      resetSearch();
      renderResults();
      clearButton.disabled = true;
      progressWrap.classList.add('is-visible');
      progressBar.style.width = '0%';
      setStatus(`正在分析 0 / ${files.length} 条音频...`);

      if (!audioContext) {
        const ContextClass = window.AudioContext || window.webkitAudioContext;
        audioContext = new ContextClass();
      }

      for (let index = 0; index < files.length; index += 1) {
        if (runId !== currentRun) return;
        const file = files[index];
        try {
          const result = await analyzeOneFile(file);
          results.push(result);
        } catch (error) {
          results.push({
            id: makeItemId(),
            name: file.name,
            duration: null,
            peak: null,
            db: null,
            audioUrl: null,
            error: error && error.message ? error.message : '浏览器无法解码该音频'
          });
        }
        const done = index + 1;
        progressBar.style.width = `${Math.round((done / files.length) * 100)}%`;
        setStatus(`正在分析 ${done} / ${files.length} 条音频...`);
        renderResults();
        await nextFrame();
      }

      if (runId !== currentRun) return;
      progressWrap.classList.remove('is-visible');
      progressBar.style.width = '0%';
      clearButton.disabled = results.length === 0;
      const validCount = results.filter((item) => item.db !== null).length;
      setStatus(validCount ? `分析完成：成功读取 ${validCount} 条音频。` : '没有成功读取的音频。', validCount === 0);
      renderResults();
    }

    async function analyzeOneFile(file) {
      const arrayBuffer = await file.arrayBuffer();
      const decoded = await audioContext.decodeAudioData(arrayBuffer.slice(0));
      let peak = 0;

      for (let channel = 0; channel < decoded.numberOfChannels; channel += 1) {
        const data = decoded.getChannelData(channel);
        for (let sampleIndex = 0; sampleIndex < data.length; sampleIndex += 1) {
          const absolute = Math.abs(data[sampleIndex]);
          if (absolute > peak) peak = absolute;
        }
      }

      return {
        id: makeItemId(),
        name: file.name,
        duration: decoded.duration,
        peak,
        db: peak > 0 ? 20 * Math.log10(peak) : Number.NEGATIVE_INFINITY,
        audioUrl: URL.createObjectURL(file),
        error: null
      };
    }

    function renderResults() {
      const sorted = getVisibleResults();
      const validResults = sorted.filter((item) => item.db !== null);
      const lowest = validResults[0] || null;
      const maxPeak = Math.max(...validResults.map((item) => item.peak), 0);

      countMetric.textContent = `${validResults.length} 条`;
      lowestMetric.textContent = lowest ? lowest.name : results.length ? '无匹配' : '等待上传';
      peakMetric.textContent = lowest ? formatDb(lowest.db) : '-- dBFS';
      clearButton.disabled = results.length === 0;
      searchPanel.classList.toggle('hidden', results.length === 0);
      searchCount.textContent = `显示 ${sorted.length} / ${results.length} 条`;
      clearSearchButton.disabled = searchTerm.length === 0;

      resultsBody.innerHTML = '';
      for (const item of sorted) {
        const row = document.createElement('tr');
        if (lowest && item === lowest) row.className = 'lowest-row';
        if (!item.error && item.audioUrl) {
          row.classList.add('playable-row');
          row.addEventListener('click', () => playItem(item));
        }
        if (item.id === activeItemId && !audioPlayer.paused) row.classList.add('playing-row');

        const statusCell = document.createElement('td');
        if (item.error) {
          statusCell.textContent = '无法读取';
          statusCell.style.color = 'var(--danger)';
        } else if (lowest && item === lowest) {
          const badge = document.createElement('span');
          badge.className = 'badge';
          badge.textContent = '最低';
          statusCell.appendChild(badge);
        } else {
          statusCell.textContent = '已分析';
        }

        const playCell = document.createElement('td');
        if (item.error || !item.audioUrl) {
          playCell.textContent = '--';
          playCell.className = 'mono';
        } else {
          const playButton = document.createElement('button');
          playButton.type = 'button';
          playButton.className = 'play-button';
          playButton.textContent = item.id === activeItemId && !audioPlayer.paused ? '正在播放' : '播放';
          playButton.addEventListener('click', (event) => {
            event.stopPropagation();
            playItem(item);
          });
          playCell.appendChild(playButton);
        }

        const nameCell = document.createElement('td');
        nameCell.className = 'name-cell';
        nameCell.textContent = item.name;

        const dbCell = document.createElement('td');
        dbCell.className = 'mono';
        dbCell.textContent = item.error ? item.error : formatDb(item.db);

        const peakCell = document.createElement('td');
        peakCell.className = 'mono';
        peakCell.textContent = item.error ? '--' : item.peak.toFixed(6);

        const durationCell = document.createElement('td');
        durationCell.className = 'mono';
        durationCell.textContent = item.duration === null ? '--' : formatDuration(item.duration);

        const barCell = document.createElement('td');
        const track = document.createElement('div');
        track.className = 'bar-track';
        const fill = document.createElement('div');
        fill.className = 'bar-fill';
        fill.style.width = item.error || maxPeak === 0 ? '0%' : `${Math.max(1, Math.round((item.peak / maxPeak) * 100))}%`;
        track.appendChild(fill);
        barCell.appendChild(track);

        row.append(statusCell, playCell, nameCell, dbCell, peakCell, durationCell, barCell);
        resultsBody.appendChild(row);
      }

      const hasRows = sorted.length > 0;
      resultsWrap.classList.toggle('hidden', !hasRows);
      emptyState.classList.toggle('hidden', hasRows);
      emptyState.textContent = results.length && searchTerm ? '没有匹配的音频。' : '上传后会在这里显示排序结果，排在第一位的就是目标音频。';
    }

    function playItem(item) {
      if (!item || !item.audioUrl) return;
      cancelScheduledPlayback();
      if (activeAudioUrl !== item.audioUrl) {
        audioPlayer.src = item.audioUrl;
        activeAudioUrl = item.audioUrl;
      }
      audioPlayer.loop = false;
      activeItemId = item.id;
      playerTitle.textContent = `正在播放：${item.name}`;
      playerPanel.classList.remove('hidden');
      const playPromise = audioPlayer.play();
      if (playPromise && typeof playPromise.catch === 'function') {
        playPromise
          .then(() => {
            setStatus(`正在播放：${item.name}`);
            renderResults();
          })
          .catch(() => {
            setStatus('浏览器暂时阻止了播放，请再点一次该音频。', true);
            renderResults();
          });
      } else {
        setStatus(`正在播放：${item.name}`);
        renderResults();
      }
    }

    function playNextItem() {
      const playableItems = getVisibleResults().filter((item) => !item.error && item.audioUrl);
      if (!playableItems.length) {
        renderResults();
        return;
      }
      const currentIndex = playableItems.findIndex((item) => item.id === activeItemId);
      const nextItem = playableItems[currentIndex + 1];
      if (nextItem) {
        playItem(nextItem);
      } else {
        setStatus('已播放到最后一条音频。');
        renderResults();
      }
    }

    function updatePlaybackModeButtons() {
      audioPlayer.loop = false;
      repeatOneButton.setAttribute('aria-pressed', repeatOne ? 'true' : 'false');
      autoNextButton.setAttribute('aria-pressed', autoNext ? 'true' : 'false');
    }

    function schedulePlayback(callback) {
      cancelScheduledPlayback();
      setStatus(`等待 ${(playbackGapMs / 1000).toFixed(1)} 秒后继续播放...`);
      playbackDelayTimer = window.setTimeout(() => {
        playbackDelayTimer = null;
        callback();
      }, playbackGapMs);
      renderResults();
    }

    function cancelScheduledPlayback() {
      if (playbackDelayTimer !== null) {
        window.clearTimeout(playbackDelayTimer);
        playbackDelayTimer = null;
      }
    }

    function getSortedResults() {
      return [...results].sort((a, b) => {
        if (a.db === null && b.db === null) return a.name.localeCompare(b.name, 'zh-CN');
        if (a.db === null) return 1;
        if (b.db === null) return -1;
        return a.db - b.db;
      });
    }

    function getVisibleResults() {
      const sorted = getSortedResults();
      if (!searchTerm) return sorted;
      return sorted.filter((item) => item.name.toLocaleLowerCase('zh-CN').includes(searchTerm));
    }

    function resetSearch() {
      searchTerm = '';
      searchInput.value = '';
      clearSearchButton.disabled = true;
    }

    function clearPlayback() {
      cancelScheduledPlayback();
      audioPlayer.pause();
      audioPlayer.removeAttribute('src');
      audioPlayer.load();
      activeAudioUrl = null;
      activeItemId = null;
      playerTitle.textContent = '未选择音频';
      playerPanel.classList.add('hidden');
    }

    function revokeResultUrls() {
      for (const item of results) {
        if (item.audioUrl) URL.revokeObjectURL(item.audioUrl);
      }
    }

    function makeItemId() {
      if (window.crypto && typeof window.crypto.randomUUID === 'function') {
        return window.crypto.randomUUID();
      }
      return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function setStatus(message, isError = false) {
      statusLine.textContent = message;
      statusLine.classList.toggle('error', isError);
    }

    function formatDb(value) {
      if (value === Number.NEGATIVE_INFINITY) return '-∞ dBFS';
      return `${value.toFixed(2)} dBFS`;
    }

    function formatDuration(seconds) {
      const minutes = Math.floor(seconds / 60);
      const wholeSeconds = Math.floor(seconds % 60).toString().padStart(2, '0');
      const hundredths = Math.round((seconds % 1) * 100).toString().padStart(2, '0');
      return `${minutes}:${wholeSeconds}.${hundredths}`;
    }

    function looksLikeAudio(name) {
      return /\.(aac|aiff?|flac|m4a|mp3|oga|ogg|opus|wav|weba|webm|wma)$/i.test(name);
    }

    function nextFrame() {
      return new Promise((resolve) => requestAnimationFrame(resolve));
    }

    updatePlaybackModeButtons();
  </script>
</body>
</html>
