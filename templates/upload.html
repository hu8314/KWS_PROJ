{% extends "base.html" %}

{% block title %}上传音频 - KWS测试工具{% endblock %}

{% block content %}
<div class="page-header">
    <h1><span class="title-icon">UP</span> 上传并合成音频</h1>
</div>

<div class="upload-container">
    <div class="upload-section">
        <div class="tabs">
            <button class="tab-btn active" data-tab="uploadTab" onclick="switchTab('uploadTab')">📁 上传新文件</button>
            <button class="tab-btn" data-tab="datasetTab" onclick="switchTab('datasetTab')">🗄️ 选择已有数据集</button>
        </div>
        
        <div id="uploadTab" class="tab-content active">
            <div class="drop-zone" id="dropZone">
                <div class="drop-icon">📁</div>
                <p>拖拽文件到此处，或 <span class="link">点击选择</span></p>
                <p class="hint">支持 ZIP 压缩包 或 多个 WAV 文件</p>
                <input type="file" id="fileInput" accept=".zip,.wav" multiple hidden>
            </div>
            <div class="file-list" id="fileList"></div>
        </div>
        
        <div id="datasetTab" class="tab-content">
            <div class="dataset-select-area" id="datasetSelectArea">
                <p class="hint">正在加载数据集列表...</p>
            </div>
        </div>
    </div>

    <div class="config-section">
        <h3>⚙️ 合成参数</h3>
        <div class="form-group">
            <label>任务名称</label>
            <input type="text" id="taskName" placeholder="输入任务名称" value="">
        </div>
        <div class="form-group">
            <label>任务类型</label>
            <select id="taskType">
                <option value="wake">唤醒</option>
                <option value="oenshot">oenshot指令唤醒</option>
                <option value="voiceprint">声纹识别</option>
            </select>
        </div>
        <div class="form-row" id="voiceprintCounts" style="display:none;">
            <div class="form-group">
                <label>库内条数</label>
                <input type="number" id="voiceprintInCount" value="10" min="0">
            </div>
            <div class="form-group">
                <label>库外条数</label>
                <input type="number" id="voiceprintOutCount" value="10" min="0">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>音频间隔 (秒)</label>
                <input type="number" id="silenceDuration" value="3" min="0" max="60">
            </div>
            <div class="form-group">
                <label>采样率 (Hz)</label>
                <input type="number" id="sampleRate" value="16000" min="8000" max="48000">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>位深 (bit)</label>
                <input type="number" id="bitDepth" value="16" min="8" max="32">
            </div>
            <div class="form-group">
                <label>声道数</label>
                <input type="number" id="channels" value="1" min="1" max="2">
            </div>
        </div>

        <h3>🌍 测试环境</h3>
        <div class="form-row">
            <div class="form-group">
                <label>测试距离</label>
                <div class="editable-select" data-options='{{ distances | tojson }}'>
                    <input type="text" id="distance" value="3m" autocomplete="off">
                    <button type="button" class="editable-select-toggle" aria-label="Toggle distance options">&#9662;</button>
                    <div class="editable-select-menu"></div>
                </div>
            </div>
            <div class="form-group">
                <label>测试角度</label>
                <div class="editable-select" data-options='{{ angles | tojson }}'>
                    <input type="text" id="angle" value="90°" autocomplete="off">
                    <button type="button" class="editable-select-toggle" aria-label="Toggle angle options">&#9662;</button>
                    <div class="editable-select-menu"></div>
                </div>
            </div>
        </div>
        <div class="form-group">
            <label>噪音等级</label>
            <div class="editable-select" data-options='{{ noise_levels | tojson }}'>
                <input type="text" id="noiseLevel" value="{{ noise_levels[0] }}" autocomplete="off">
                <button type="button" class="editable-select-toggle" aria-label="Toggle noise level options">&#9662;</button>
                <div class="editable-select-menu"></div>
            </div>
        </div>

        <div class="preview-info" id="previewInfo" style="display:none;">
            <p>预计合成 <strong id="previewCount">0</strong> 个文件</p>
            <p>预计总时长约 <strong id="previewDuration">0</strong> 秒</p>
        </div>

        <button class="btn btn-primary btn-block synthesis-action-btn" id="startBtn" type="button" data-state="idle" disabled>
            <span class="synthesis-btn-fill" id="progressFill"></span>
            <span class="synthesis-btn-text" id="progressText">🚀 开始合成</span>
        </button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const fileList = document.getElementById('fileList');
const startBtn = document.getElementById('startBtn');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');
const previewInfo = document.getElementById('previewInfo');
const previewCount = document.getElementById('previewCount');
const previewDuration = document.getElementById('previewDuration');
const datasetSelectArea = document.getElementById('datasetSelectArea');
const taskTypeSelect = document.getElementById('taskType');
const voiceprintCounts = document.getElementById('voiceprintCounts');

let selectedFiles = [];
let selectedDatasetId = null;
let availableDatasets = [];
let synthesisJobId = null;
let synthesisPollTimer = null;
let synthesisState = 'idle';
let openedSynthesisTaskId = null;

function hasSynthesisSource() {
    const activeTab = document.querySelector('.tab-content.active').id;
    return activeTab === 'uploadTab' ? selectedFiles.length > 0 : Boolean(selectedDatasetId);
}

function setSynthesisButton(text, state = 'idle', width = '0%', title = '') {
    synthesisState = state;
    startBtn.dataset.state = state;
    progressFill.style.width = width;
    progressText.textContent = text;
    startBtn.title = title;
    startBtn.classList.toggle('has-progress', state !== 'idle');
    updateStartButton();
}

function resetSynthesisButton() {
    stopSynthesisPolling();
    synthesisJobId = null;
    openedSynthesisTaskId = null;
    setSynthesisButton('🚀 开始合成', 'idle', '0%', '');
}

function stopSynthesisPolling() {
    if (synthesisPollTimer) {
        clearInterval(synthesisPollTimer);
        synthesisPollTimer = null;
    }
}

function startSynthesisPolling() {
    stopSynthesisPolling();
    synthesisPollTimer = setInterval(pollSynthesisJob, 700);
}

function clampPercent(value) {
    const percent = Number(value);
    if (!Number.isFinite(percent)) return 0;
    return Math.min(100, Math.max(0, percent));
}

function renderSynthesisJob(job) {
    if (!job) return;
    const width = `${clampPercent(job.percent)}%`;
    const progressTextSuffix = job.total ? `${job.processed || 0}/${job.total}` : '';
    const message = job.message || (progressTextSuffix ? `合成中 ${progressTextSuffix}` : '合成中...');

    if (job.status === 'queued' || job.status === 'running') {
        setSynthesisButton(message, 'running', width, '点击暂停合成');
    } else if (job.status === 'paused') {
        setSynthesisButton(message || '已暂停，点击继续合成', 'paused', width, '点击继续合成');
    } else if (job.status === 'done') {
        stopSynthesisPolling();
        setSynthesisButton('合成成功，正在打开任务...', 'done', '100%', '合成成功');
        openSynthesisTask(job);
    } else if (job.status === 'error') {
        stopSynthesisPolling();
        const errorTitle = job.error ? `合成失败：${job.error}。点击重新合成` : '点击重新合成';
        setSynthesisButton(job.error ? `合成失败：${job.error}` : '合成失败，点击重新开始', 'error', '0%', errorTitle);
    }
}

function openSynthesisTask(job) {
    if (!job.task_id || openedSynthesisTaskId === job.task_id) return;
    openedSynthesisTaskId = job.task_id;
    setTimeout(() => {
        if (window.AudioLabCurrentTask) {
            window.AudioLabCurrentTask.set({
                taskId: job.task_id,
                taskName: job.task_name || document.getElementById('taskName').value || '测试任务',
                url: `/player/${job.task_id}`,
                updatedAt: Date.now()
            });
            window.open(`/player/${job.task_id}`, window.AudioLabCurrentTask.windowName || 'currentTaskWindow');
        } else {
            window.location.href = `/player/${job.task_id}`;
        }
        setTimeout(resetSynthesisButton, 1200);
    }, 500);
}

async function parseErrorMessage(res, fallback) {
    try {
        const data = await res.json();
        return data.detail || data.error || fallback;
    } catch (e) {
        return fallback;
    }
}

async function pollSynthesisJob() {
    if (!synthesisJobId) return;
    try {
        const res = await fetch(`/api/synthesis-jobs/${encodeURIComponent(synthesisJobId)}`);
        if (!res.ok) throw new Error(await parseErrorMessage(res, '获取合成进度失败'));
        const data = await res.json();
        renderSynthesisJob(data.job);
    } catch (e) {
        stopSynthesisPolling();
        setSynthesisButton(`进度获取失败：${e.message}`, 'error', '0%', '点击重新合成');
    }
}

async function pauseSynthesisJob() {
    if (!synthesisJobId) return;
    setSynthesisButton('正在暂停...', 'pausing', progressFill.style.width || '0%', '正在暂停合成');
    try {
        const res = await fetch(`/api/synthesis-jobs/${encodeURIComponent(synthesisJobId)}/pause`, { method: 'POST' });
        if (!res.ok) throw new Error(await parseErrorMessage(res, '暂停失败'));
        const data = await res.json();
        renderSynthesisJob(data.job);
    } catch (e) {
        setSynthesisButton(`暂停失败：${e.message}`, 'error', progressFill.style.width || '0%', '点击重新合成');
    }
}

async function resumeSynthesisJob() {
    if (!synthesisJobId) return;
    setSynthesisButton('继续合成中...', 'running', progressFill.style.width || '0%', '点击暂停合成');
    try {
        const res = await fetch(`/api/synthesis-jobs/${encodeURIComponent(synthesisJobId)}/resume`, { method: 'POST' });
        if (!res.ok) throw new Error(await parseErrorMessage(res, '继续失败'));
        const data = await res.json();
        renderSynthesisJob(data.job);
        startSynthesisPolling();
    } catch (e) {
        setSynthesisButton(`继续失败：${e.message}`, 'error', progressFill.style.width || '0%', '点击重新合成');
    }
}

function updateVoiceprintCountVisibility() {
    voiceprintCounts.style.display = taskTypeSelect.value === 'voiceprint' ? 'flex' : 'none';
}

taskTypeSelect.addEventListener('change', updateVoiceprintCountVisibility);
updateVoiceprintCountVisibility();

// 点击上传
dropZone.addEventListener('click', () => fileInput.click());

// 文件选择
fileInput.addEventListener('change', (e) => {
    handleFiles(e.target.files);
});

// 拖拽上传
dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('dragover');
});
dropZone.addEventListener('dragleave', () => {
    dropZone.classList.remove('dragover');
});
dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    handleFiles(e.dataTransfer.files);
});

function handleFiles(files) {
    selectedFiles = Array.from(files);
    updateFileList();
}

function updateFileList() {
    if (selectedFiles.length === 0) {
        fileList.innerHTML = '';
        previewInfo.style.display = 'none';
        updateStartButton();
        return;
    }

    fileList.innerHTML = '';
    const title = document.createElement('h4');
    title.textContent = '已选择文件';
    const list = document.createElement('ul');
    let wavCount = 0;
    let hasZip = false;
    
    selectedFiles.forEach(f => {
        const isWav = f.name.toLowerCase().endsWith('.wav');
        const isZip = f.name.toLowerCase().endsWith('.zip');
        if (isWav) wavCount++;
        if (isZip) hasZip = true;
        const icon = isZip ? 'ZIP' : (isWav ? 'WAV' : 'FILE');
        const item = document.createElement('li');
        const size = document.createElement('small');
        item.append(document.createTextNode(`${icon} ${f.name} `));
        size.textContent = `(${(f.size / 1024 / 1024).toFixed(2)} MB)`;
        item.appendChild(size);
        list.appendChild(item);
    });
    fileList.append(title, list);
    
    // 预估
    const silence = parseInt(document.getElementById('silenceDuration').value) || 3;
    previewCount.textContent = hasZip ? '若干' : wavCount;
    previewDuration.textContent = hasZip ? '未知' : (wavCount * (2 + silence));
    previewInfo.style.display = 'block';
    updateStartButton();
}

// ===== 标签页切换 =====
async function switchTab(tabId) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.querySelector(`.tab-btn[data-tab="${tabId}"]`).classList.add('active');
    document.getElementById(tabId).classList.add('active');
    
    if (tabId === 'datasetTab') {
        await loadDatasets();
        updateStartButton();
    } else {
        updateStartButton();
    }
}

async function loadDatasets() {
    if (availableDatasets.length > 0) return;
    try {
        const res = await fetch('/api/datasets');
        const data = await res.json();
        availableDatasets = data.datasets || [];
        renderDatasetList();
    } catch (e) {
        datasetSelectArea.innerHTML = '';
        const error = document.createElement('p');
        error.className = 'hint';
        error.style.color = 'var(--danger)';
        error.textContent = `加载失败: ${e.message}`;
        datasetSelectArea.appendChild(error);
    }
}

function renderDatasetList() {
    if (availableDatasets.length === 0) {
        datasetSelectArea.innerHTML = `
            <div class="empty-state" style="padding:40px 20px;">
                <div class="empty-icon" style="font-size:40px;">🗄️</div>
                <p>暂无数据集</p>
                <a href="/datasets" class="btn btn-primary" style="margin-top:12px;">去上传数据集</a>
            </div>`;
        return;
    }
    
    datasetSelectArea.innerHTML = '';
    const list = document.createElement('div');
    list.className = 'dataset-list-select';
    availableDatasets.forEach(ds => {
        const option = document.createElement('div');
        const name = document.createElement('div');
        const meta = document.createElement('div');
        option.className = 'dataset-option';
        option.dataset.id = ds.dataset_id;
        option.addEventListener('click', () => selectDataset(ds.dataset_id));
        name.className = 'dataset-option-name';
        name.textContent = ds.dataset_name;
        meta.className = 'dataset-option-meta';
        meta.textContent = `${ds.total_files} 个文件 · ${ds.create_time}`;
        option.append(name, meta);
        list.appendChild(option);
    });
    datasetSelectArea.appendChild(list);
}

function selectDataset(datasetId) {
    selectedDatasetId = datasetId;
    document.querySelectorAll('.dataset-option').forEach(el => {
        el.classList.toggle('selected', el.dataset.id === datasetId);
    });
    
    const ds = availableDatasets.find(d => d.dataset_id === datasetId);
    if (ds) {
        previewCount.textContent = ds.total_files;
        const silence = parseInt(document.getElementById('silenceDuration').value) || 3;
        previewDuration.textContent = ds.total_files * (2 + silence);
        previewInfo.style.display = 'block';
    }
    updateStartButton();
}

function updateStartButton() {
    if (synthesisState === 'running' || synthesisState === 'paused') {
        startBtn.disabled = false;
        return;
    }
    if (synthesisState === 'starting' || synthesisState === 'pausing' || synthesisState === 'done') {
        startBtn.disabled = true;
        return;
    }
    startBtn.disabled = !hasSynthesisSource();
}

async function createSynthesisJob() {
    const activeTab = document.querySelector('.tab-content.active').id;
    if (activeTab === 'uploadTab' && selectedFiles.length === 0) return;
    if (activeTab === 'datasetTab' && !selectedDatasetId) return;

    stopSynthesisPolling();
    synthesisJobId = null;
    openedSynthesisTaskId = null;
    setSynthesisButton('正在提交合成...', 'starting', '4%', '正在提交合成');
    
    const commonParams = {
        task_name: document.getElementById('taskName').value || `测试任务_${new Date().toLocaleString()}`,
        task_type: taskTypeSelect.value,
        voiceprint_in_count: document.getElementById('voiceprintInCount').value,
        voiceprint_out_count: document.getElementById('voiceprintOutCount').value,
        silence_duration: document.getElementById('silenceDuration').value,
        sample_rate: document.getElementById('sampleRate').value,
        bit_depth: document.getElementById('bitDepth').value,
        channels: document.getElementById('channels').value,
        distance: document.getElementById('distance').value,
        angle: document.getElementById('angle').value,
        noise_level: document.getElementById('noiseLevel').value
    };
    
    try {
        let res;
        const formData = new FormData();
        Object.entries(commonParams).forEach(([k, v]) => formData.append(k, v));

        if (activeTab === 'uploadTab') {
            selectedFiles.forEach(f => formData.append('files', f));
            res = await fetch('/api/synthesis-jobs/upload', { method: 'POST', body: formData });
        } else {
            formData.append('dataset_id', selectedDatasetId);
            res = await fetch('/api/synthesis-jobs/from-dataset', { method: 'POST', body: formData });
        }

        if (!res.ok) throw new Error(await parseErrorMessage(res, '创建合成作业失败'));
        
        const data = await res.json();
        if (!data.success) throw new Error(data.detail || data.error || '创建合成作业失败');

        synthesisJobId = data.job_id || data.task_id;
        renderSynthesisJob(data.job || {
            status: 'running',
            percent: 8,
            processed: 0,
            total: activeTab === 'datasetTab' ? Number(previewCount.textContent) || 0 : selectedFiles.length,
            message: '合成中...'
        });
        startSynthesisPolling();
        await pollSynthesisJob();
    } catch (e) {
        synthesisJobId = null;
        stopSynthesisPolling();
        setSynthesisButton(`创建失败：${e.message}`, 'error', '0%', '点击重新合成');
    }
}

startBtn.addEventListener('click', async () => {
    if (synthesisState === 'running') {
        await pauseSynthesisJob();
        return;
    }
    if (synthesisState === 'paused') {
        await resumeSynthesisJob();
        return;
    }
    if (synthesisState === 'starting' || synthesisState === 'pausing' || synthesisState === 'done') {
        return;
    }
    await createSynthesisJob();
});

// 参数变化时更新预估
document.getElementById('silenceDuration').addEventListener('change', () => {
    if (selectedFiles.length > 0) updateFileList();
    if (selectedDatasetId) selectDataset(selectedDatasetId);
});
</script>
{% endblock %}
